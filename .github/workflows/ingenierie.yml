# Ingénierie (MISSION.md, Gouvernance et « Décider vite ») : une demande étiquetée `ingenierie` devient une PR, fusionnée
# seule si tout est vert. Démarre à l'événement, jamais à date fixe :
#   - un agent écrit la demande et lance ce workflow (agence/ingenierie.py, `demander`) ;
#   - Jules pose l'étiquette `ingenierie` sur une issue, ou lance `gh workflow run ingenierie.yml -f issue=<n>` ;
#   - reprise sans Claude d'une PR restée ouverte (relecteur muet, banc en panne) : `-f pr=<n>`.
# Le code qui décide (agence/ingenierie.py, protege.py, relecture.py) vient toujours de main. Claude travaille dans une
# copie à part ($RUNNER_TEMP/travail) ; les tests et le banc de la PR tournent dans un clone propre de son commit
# ($RUNNER_TEMP/pr), sans jeton GitHub ni jeton Claude.
# Une PR ouverte avec GITHUB_TOKEN ne déclenche aucun autre workflow : tout ce qui la contrôle est lancé ici.
# Le jeton du workflow n'a pas le droit `workflows` : une PR de l'Ingénierie ne peut pas pousser dans .github/workflows/.
name: Ingénierie

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Numéro de la demande (issue étiquetée ingenierie)
        required: false
      pr:
        description: "Reprise sans Claude : numéro d'une PR de l'Ingénierie restée ouverte"
        required: false

permissions:
  contents: write         # pousser la branche, fusionner, commiter le registre
  pull-requests: write    # ouvrir, commenter, fusionner
  issues: write           # répondre dans la demande et la fermer

concurrency:
  group: ingenierie-${{ github.event.issue.number || inputs.issue || inputs.pr }}
  cancel-in-progress: false

jobs:
  ingenierie:
    # Une étiquette ne compte que posée par Jules ; un agent passe par workflow_dispatch (réservé à qui peut écrire)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ingenierie' && github.event.sender.login == 'sueurhocqjules-droid')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code@2.1.321   # version figée, la même que semaine.yml
        if: ${{ !inputs.pr }}
      - run: |
          git config --global user.name "agence-robot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # De quoi isoler les commandes que lance Claude (ses tests ne voient alors pas son jeton). Si l'installation
      # échoue (serveurs d'Ubuntu en panne le 11/11), la séance a lieu quand même, sans cette isolation
      - name: Isolation des commandes de Claude (bubblewrap, socat)
        if: ${{ !inputs.pr }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Par le lanceur : pause, budget de la semaine, journal. Claude ne reçoit que son jeton (agence/ingenierie.py)
      - name: Construire (séance Claude, puis PR ouverte par le script)
        id: construire
        if: ${{ !inputs.pr }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEMANDE: ${{ github.event.issue.number || inputs.issue }}
        run: python -m agence.lancer ingenierie construire "$DEMANDE"
      - name: Reprendre une PR restée ouverte (sans Claude)
        id: reprendre
        if: ${{ inputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: python -m agence.ingenierie reprendre "$PR"

      # Code de la PR, sans aucun secret. Jamais dans $RUNNER_TEMP/travail : l'isolation de Claude y laisse des points
      # de montage vides, dont un package.json que Node refuse (« Invalid package config », vu le 14/11)
      - name: Tests de la PR
        id: tests
        if: ${{ steps.construire.outputs.pr || steps.reprendre.outputs.pr }}
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}/pr
        run: python -m unittest discover tests
      # Code de la PR, avec les seules clés des modèles gratuits (comme banc.yml), si elle touche un agent ou sa fiche
      - name: Banc des agents sur la PR
        id: banc
        if: ${{ (steps.construire.outputs.banc || steps.reprendre.outputs.banc) == 'true' }}
        continue-on-error: true
        timeout-minutes: 25
        working-directory: ${{ runner.temp }}/pr
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m agence.banc_agents

      # Code de main : la PR n'est lue que comme une donnée
      - name: Contrôle des fichiers protégés
        id: protege
        if: ${{ steps.construire.outputs.pr || steps.reprendre.outputs.pr }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.construire.outputs.pr || steps.reprendre.outputs.pr }}
        run: python -m agence.protege "$PR"
      - name: Relecture par un modèle qui n'est pas Claude
        id: relecture
        if: ${{ steps.construire.outputs.pr || steps.reprendre.outputs.pr }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.construire.outputs.pr || steps.reprendre.outputs.pr }}
        run: python -m agence.relecture "$PR"

      - name: Fusion, attente de Jules, ou PR laissée ouverte
        if: ${{ steps.construire.outputs.pr || steps.reprendre.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.construire.outputs.pr || steps.reprendre.outputs.pr }}
          INGENIERIE_SHA: ${{ steps.construire.outputs.sha || steps.reprendre.outputs.sha }}
          INGENIERIE_ISSUE: ${{ steps.construire.outputs.issue || steps.reprendre.outputs.issue }}
          INGENIERIE_TESTS: ${{ steps.tests.outcome }}
          INGENIERIE_BANC: ${{ steps.banc.outcome }}
          INGENIERIE_BANC_DEMANDE: ${{ steps.construire.outputs.banc || steps.reprendre.outputs.banc }}
          INGENIERIE_CONTROLE: ${{ steps.protege.outcome }}
          INGENIERIE_PROTEGE: ${{ steps.protege.outputs.protege }}
          INGENIERIE_VERDICT: ${{ steps.relecture.outputs.verdict }}
        run: python -m agence.ingenierie conclure "$PR"

      # Coût, journal et décision. Pas de groupe « registre » (un lancement long ferait attendre le réveil) : les
      # journaux sont en ajout seul (merge=union dans .gitattributes), on rebase et on réessaie
      - name: Commiter le registre
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git add registre
          git diff --cached --quiet || git commit -q -m "Registre : Ingénierie du $(date -u +%Y-%m-%dT%H:%MZ)"
          for essai in 1 2 3 4; do
            git -c http.https://github.com/.extraheader="$auth" pull -q --rebase \
              && git -c http.https://github.com/.extraheader="$auth" push -q && exit 0
            sleep $((essai * 7))
          done
          exit 1
