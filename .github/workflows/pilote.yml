# Séance du Pilote : le seul agent qui décide (organisation/PILOTE.md). Lancée par le réveil aux créneaux que le
# Pilote choisit (organisation/rythme.toml), ou à la main : gh workflow run pilote.yml
# Règle de deux : le job « seance » exécute Claude et le code qu'il écrit, donc il n'a que des droits en lecture et
# aucune clé lisible par ses commandes. Le tri (fichiers protégés retirés, tests) se fait dans une étape à part, sans
# clé, après la fin de Claude. Seul le job « publier » écrit (registre, guichet, Telegram, studio) : il exécute le
# pilote.py du main, garde les réglages libres, met le reste du code de côté dans une PR fusionnée seulement sur le
# Oui de Jules (Telegram), fait passer le juge (conseil) puis relance le Pilote s'il l'a demandé (mode continu).
# Le tableau de bord et le push tournent dans des étapes sans les clés Telegram, Gemini et Groq.
name: Pilote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilote        # une séance à la fois
  cancel-in-progress: false

jobs:
  seance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read     # demandes du guichet déjà ouvertes, données au Pilote en début de séance
    outputs:
      faite: ${{ steps.seance.outputs.faite }}
      studio: ${{ steps.trier.outputs.studio }}
      paquet: ${{ steps.paquet.outputs.paquet }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: sueurhocqjules-droid/chaines-studio
          path: chaines-studio
          ssh-key: ${{ secrets.ATELIER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chaines-studio/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Outils (numpy pour le son, ffmpeg et emojis pour les planches, Claude Code)
        timeout-minutes: 8
        env:
          OUTILS: https://github.com/sueurhocqjules-droid/studio-rendu/releases/download/outils
          FFMPEG: ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: e940c45bf07cdf0c95e279a81c5f559ff5dfe88f0f395613bfbbd68566771a45
        run: |
          pip install -q -r requirements.txt numpy
          # Bac à sable de Bash dans Claude Code sous Linux : bubblewrap + socat (absents le 17/11 : séance sans terminal)
          sudo apt-get install -y -qq bubblewrap socat > /dev/null
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev true && socat -V | head -1
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$FFMPEG" "$OUTILS/$FFMPEG"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/$FFMPEG" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/$FFMPEG" -C /usr/local/bin --strip-components=2 --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
          ffmpeg -version | head -1
          fc-list | grep -q "Noto Color Emoji" || echo "::warning::Police Noto Color Emoji absente de l'image"
          (cd chaines-studio && npm ci --no-audit --no-fund)
          npm i -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.323   # version épinglée, montée à la main
          claude --version
          git config --global user.name "pilote-robot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Séance Claude (aucune clé hors son propre jeton, illisible par ses commandes)
        id: seance
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}          # lecture seule, retiré de l'environnement de Claude
          ATELIER_COUTS: chaines-studio/atelier/couts.csv
          PILOTE_TRACE: ${{ runner.temp }}/trace/seance.jsonl   # tout ce que Claude a lu, pensé et lancé
          PYTHONUTF8: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/trace"
          python -m agence.pilote seance
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: trace
          path: ${{ runner.temp }}/trace/
          retention-days: 30
          if-no-files-found: ignore

      - name: Tri (fichiers protégés retirés, tests, studio qui compile ; sans clé)
        id: trier
        if: ${{ always() && steps.seance.outputs.faite == 'oui' }}
        env:
          PYTHONUTF8: "1"
        run: python -m agence.pilote trier

      - name: Paquets (aucun droit d'écriture dans ce job)
        id: paquet
        if: ${{ always() && steps.trier.outcome == 'success' }}
        env:
          STUDIO: ${{ steps.trier.outputs.studio }}
        run: |
          mkdir -p "$RUNNER_TEMP/paquet"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/paquet/agence.patch"
          if [ "$STUDIO" = oui ]; then
            (cd chaines-studio && git add -A && git diff --cached --binary) > "$RUNNER_TEMP/paquet/studio.patch"
          fi
          echo "paquet=oui" >> "$GITHUB_OUTPUT"
      - if: ${{ always() && steps.paquet.outputs.paquet == 'oui' }}
        uses: actions/upload-artifact@v7
        with:
          name: paquet
          path: ${{ runner.temp }}/paquet/
          retention-days: 3

  publier:
    needs: seance
    if: ${{ always() && needs.seance.outputs.paquet == 'oui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: registre    # un seul écrivain du registre à la fois (avec le réveil)
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write      # demandes au guichet écrites ou fermées par le Pilote
      actions: write     # relance du Pilote en mode continu
      pull-requests: write   # code proposé par le Pilote, fusionné seulement sur le Oui de Jules (agence/accords.py)
    outputs:
      relancer: ${{ steps.agence.outputs.relancer }}
      reprise: ${{ steps.agence.outputs.reprise }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: paquet
          path: ${{ runner.temp }}/paquet
      - name: Agence (réglages libres gardés, code proposé en PR, juge, guichet, message à Jules)
        id: agence
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # juge gratuit
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}         # juge de secours
          PYTHONUTF8: "1"
        run: |
          git config --global user.name "pilote-robot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m agence.pilote publier "$RUNNER_TEMP/paquet"
      - name: Tableau de bord (sans clé)
        env:
          PYTHONUTF8: "1"
        run: python -m agence.tableau || echo "::warning::Tableau de bord non écrit"
      - name: Pousser la séance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Pilote : séance du $(date -u +%Y-%m-%d) $(date -u +%H)h (run $GITHUB_RUN_ID)"
          for essai in 1 2 3; do
            # -X theirs : sur un conflit (tableau.md, réécrit par chaque run), la version de ce run, la plus récente, gagne
            if git -c http.https://github.com/.extraheader="$auth" pull -q --rebase -X theirs origin main; then
              git -c http.https://github.com/.extraheader="$auth" push -q origin HEAD:main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          echo "::error::Séance non poussée après 3 essais"; exit 1

      - uses: actions/checkout@v7
        if: ${{ needs.seance.outputs.studio == 'oui' }}
        with:
          repository: sueurhocqjules-droid/chaines-studio
          path: chaines-studio
          ssh-key: ${{ secrets.PILOTE_STUDIO_KEY }}
      - name: Studio (nouveaux sujets)
        if: ${{ needs.seance.outputs.studio == 'oui' }}
        run: |
          (cd chaines-studio && { git apply --index "$RUNNER_TEMP/paquet/studio.patch" || git apply --index --3way "$RUNNER_TEMP/paquet/studio.patch"; })
          PYTHONUTF8=1 python -m agence.pilote studio
          cd chaines-studio
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Pilote : sujets du $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push -q
      - uses: actions/checkout@v7
        if: ${{ needs.seance.outputs.studio == 'oui' }}
        with:
          repository: sueurhocqjules-droid/studio-rendu
          path: rendu
          ssh-key: ${{ secrets.RENDU_DEPLOY_KEY }}
      - name: Pousser le moteur vers studio-rendu
        if: ${{ needs.seance.outputs.studio == 'oui' }}
        run: |
          cd chaines-studio
          python3 scripts/synchro_rendu.py ../rendu
          cd ../rendu
          git add -A
          git diff --cached --quiet || git commit -q -m "Moteur : sujets du Pilote"
          git push -q

  relance:
    needs: publier
    if: ${{ needs.publier.outputs.relancer == 'oui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Séance suivante (le Pilote l'a demandée, séance saine d'au moins 10 min)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pilote.yml -R "$GITHUB_REPOSITORY"

  # Mode continu : une séance arrêtée par la limite de 5 h de l'abonnement reprend à la remise à zéro, sans attendre
  # le réveil suivant (jusqu'à 6 h de perdues, vécu le 18/11). L'attente occupe un runner (minutes gratuites, dépôt
  # public) et garde le run ouvert : le réveil voit une séance en cours et n'en lance pas une deuxième.
  reprise:
    needs: publier
    if: ${{ needs.publier.outputs.reprise != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      actions: write
    steps:
      - name: Attendre la remise à zéro de la limite de 5 h, puis relancer
        env:
          GH_TOKEN: ${{ github.token }}
          REPRISE: ${{ needs.publier.outputs.reprise }}
        run: |
          attente=$(( $(date -u -d "$REPRISE" +%s) - $(date -u +%s) ))
          echo "Reprise à $REPRISE (dans ${attente} s)"
          [ "$attente" -gt 0 ] && sleep "$attente"
          gh workflow run pilote.yml -R "$GITHUB_REPOSITORY"
