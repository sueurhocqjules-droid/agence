# Fichiers protégés (MISSION.md, règle 9), plan B sur GitHub gratuit (protection de branche refusée, 403) :
#   - contrôle : rouge sur toute PR qui touche .github/, MISSION.md, les autorisations de clés, le contrôle lui-même,
#     ou un test / cas de banc existant, sauf étiquette `accord-jules` posée par Jules (agence/protege.py) ;
#   - relecture : avis d'un modèle gratuit qui n'est pas Claude, en commentaire, sortie fermée (agence/relecture.py).
# `pull_request_target` : le workflow et le code viennent de main, jamais de la PR, qui ne peut donc pas assouplir son
# propre contrôle. Aucun fichier de la PR n'est extrait ni exécuté ; son numéro passe par une variable d'environnement.
# Une PR ouverte avec GITHUB_TOKEN (Ingénierie) ne déclenche rien : on lance alors `gh workflow run protege.yml -f pr=<n>`.
name: Fichiers protégés

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Numéro de la PR à contrôler
        required: true

permissions:
  contents: read
  pull-requests: write   # commentaire de relecture
  issues: read           # qui a posé l'étiquette accord-jules

concurrency:
  group: protege-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.action == 'labeled' || github.event.action == 'unlabeled' }}
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Contrôle des fichiers protégés
        run: python -m agence.protege "$PR"

  relecture:
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Relecture par un modèle gratuit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m agence.relecture "$PR"
