# Réveil programmé de l'agence : tourne sur les machines de GitHub, PC éteint.
# Tout passe par le lanceur (python -m agence.lancer <nom>) : pause, budget, journal. Une étape par agent, avec ses seuls secrets.
# Le registre modifié est commité par le robot GitHub.
name: Reveil

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # 6h17, 12h17, 18h17, 0h17 à Paris : GitHub retarde ou saute parfois un créneau (11/11), le flux ne refait rien de déjà fait
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # la Sûreté compte les minutes GitHub du mois ; les délais lancent l'Ingénierie (workflow_dispatch)
  issues: write       # guichet et contacts : demandes écrites par l'agence, commentaire et fermeture d'un contact envoyé
  pull-requests: read # PR qui attendent l'accord de Jules (agence/accords.py)

concurrency:
  group: registre     # un seul écrivain du registre à la fois
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Cloisonnement : le jeton du dépôt n'est pas laissé dans .git/config, seule l'étape de commit le reçoit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Moteur public : sujets à lire, et file de rendu à pousser avec la clé de déploiement (écriture sur ce seul dépôt)
      - uses: actions/checkout@v7
        with:
          repository: sueurhocqjules-droid/studio-rendu
          path: rendu
          ssh-key: ${{ secrets.RENDU_DEPLOY_KEY }}
      # Coûts des séances de l'atelier (dépôt privé chaines-studio) : clé de déploiement en lecture seule,
      # un seul fichier récupéré, clé retirée du disque après le checkout
      - uses: actions/checkout@v7
        with:
          repository: sueurhocqjules-droid/chaines-studio
          path: atelier-src
          ssh-key: ${{ secrets.ATELIER_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: atelier/couts.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config --global user.name "agence-robot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # ffmpeg statique figé dans la release « outils » de studio-rendu, empreinte vérifiée : plus d'apt-get,
      # les serveurs d'Ubuntu sont tombés le 11/11/2026
      - name: ffmpeg pour le contrôle des vidéos
        timeout-minutes: 5
        env:
          OUTILS: https://github.com/sueurhocqjules-droid/studio-rendu/releases/download/outils
          FFMPEG: ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: e940c45bf07cdf0c95e279a81c5f559ff5dfe88f0f395613bfbbd68566771a45
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$FFMPEG" "$OUTILS/$FFMPEG"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/$FFMPEG" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/$FFMPEG" -C /usr/local/bin --strip-components=2 --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
          ffmpeg -version | head -1
      # Avant tout le reste : un « Oui » de Jules (reprise d'une pause) s'applique dès ce réveil
      - name: Réponses de Jules (Telegram)
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUSION_TOKEN: ${{ secrets.FUSION_TOKEN }}   # Oui de Jules sur une PR protégée : étiquette et fusion en son nom
          ALARME_SECRET: ${{ secrets.ALARME_SECRET }} # lecture des clics gardés par le Worker de l'alarme
          PYTHONUTF8: "1"
        run: python -m agence.lancer reponses relever
      - name: PR qui attendent l'accord de Jules (question Telegram)
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: python -m agence.lancer accords
      - name: Stats des chaînes
        if: ${{ !cancelled() }}
        env:
          YT_TOKEN_EN: ${{ secrets.YT_TOKEN_EN }}
          YT_TOKEN_ES: ${{ secrets.YT_TOKEN_ES }}
          YT_TOKEN_PT: ${{ secrets.YT_TOKEN_PT }}
          PYTHONUTF8: "1"
        run: python -m agence.lancer stats
      # Après les stats (une vidéo rejetée met sa chaîne en pause), avant le flux (qui respecte cette pause)
      - name: Sûreté (compteur, seuils, sanctions)
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}   # lecture des runs du dépôt, pour les minutes du mois
          ATELIER_COUTS: atelier-src/atelier/couts.csv
          PYTHONUTF8: "1"
        run: python -m agence.lancer garde_fous
      # Avant le flux : un mail de sanction met la chaîne en pause dès ce réveil. Lecture seule, ne répond jamais
      - name: Courrier (tri de prod.hack05)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: python -m agence.lancer courrier
      - name: Flux (rendu, contrôle, programmation, diffusion Instagram, Facebook, TikTok et Threads)
        if: ${{ !cancelled() }}
        env:
          YT_TOKEN_EN: ${{ secrets.YT_TOKEN_EN }}
          YT_TOKEN_ES: ${{ secrets.YT_TOKEN_ES }}
          YT_TOKEN_PT: ${{ secrets.YT_TOKEN_PT }}
          GH_TOKEN: ${{ github.token }}   # lecture des artefacts du dépôt public studio-rendu
          META_TOKEN: ${{ secrets.META_TOKEN }}   # utilisateur système Meta : 3 comptes Instagram, 3 Pages
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}   # Buffer (offre Free) : publication TikTok sur les 3 comptes
          THREADS_CLE: ${{ secrets.THREADS_CLE }}   # déchiffre registre/threads.enc (jetons Threads, renouvelés par le flux)
          RENDU_DIR: rendu
          PYTHONUTF8: "1"
        run: python -m agence.lancer flux
      # Après les stats (vues sur 90 jours) : seuils de monétisation et commentaires, clé publique en lecture seule
      - name: Guetteur (seuils, commentaires)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: python -m agence.lancer guetteur
      # « Décider vite » (MISSION.md) : un besoin écrit depuis plus de 48 h fait partir en essai, chez l'Ingénierie, sa
      # première option gratuite et sans compte. Sans modèle. Un départ par réveil au plus
      - name: Délais des besoins (départ en essai à 48 h)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}   # écrit la demande à l'Ingénierie et lance son workflow
          PYTHONUTF8: "1"
        run: python -m agence.lancer delais partir
      # Messages validés par Jules (issues `contact` + `valide`). Sans GMAIL_SEND_TOKEN (droit gmail.send seul), rien ne
      # part : le script le demande au guichet, une fois. Jeton d'envoi à part de celui du Courrier (lecture seule)
      - name: Contacts (messages validés)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GMAIL_SEND_TOKEN: ${{ secrets.GMAIL_SEND_TOKEN }}
          GH_TOKEN: ${{ github.token }}   # lecture et écriture des issues `contact` et `guichet`
          PYTHONUTF8: "1"
        run: python -m agence.lancer contacts envoyer
      # En dernier : les demandes écrites pendant ce réveil sont dans le récapitulatif (une fois par jour, urgent tout de suite)
      - name: Guichet (récapitulatif à Jules)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}   # lecture des issues `guichet` et `contact`
          PYTHONUTF8: "1"
        run: python -m agence.lancer guichet recap
      # Séances de la Direction en semaine, au rythme qu'elle choisit elle-même (organisation/rythme.toml,
      # MISSION « Lancement », Jules le 16/11). La boucle relancée attend la fin de ce réveil (même groupe de concurrence).
      # Seulement sur un réveil programmé, pour qu'aucune relance à la main ne déclenche de boucle en chaîne
      - name: Séance de la Direction (rythme choisi)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          n=$(python -c "import tomllib; print(int(tomllib.load(open('organisation/rythme.toml','rb'))['direction']['seances_par_jour']))" || echo 0)
          h=$((10#$(date -u +%H)))
          if   [ $h -ge 5 ]  && [ $h -lt 11 ]; then creneau=matin
          elif [ $h -ge 11 ] && [ $h -lt 17 ]; then creneau=midi
          elif [ $h -ge 17 ] && [ $h -lt 23 ]; then creneau=soir
          else creneau=nuit; fi
          case "$n" in
            1) creneaux="soir" ;;
            2) creneaux="matin soir" ;;
            3) creneaux="matin midi soir" ;;
            4) creneaux="matin midi soir nuit" ;;
            *) creneaux="" ;;
          esac
          # Dimanche soir : la boucle est déjà programmée par semaine.yml
          if [ "$(date -u +%u)" = 7 ] && [ "$creneau" = soir ]; then creneaux=""; fi
          case " $creneaux " in
            *" $creneau "*) gh workflow run semaine.yml -f essai=false && echo "Boucle de la semaine relancée ($creneau, $n séance(s) par jour)" ;;
            *) echo "Pas de séance à ce créneau ($creneau, $n séance(s) par jour)" ;;
          esac
      - name: Commiter le registre
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git add registre
          git diff --cached --quiet || git commit -q -m "Registre : réveil du $(date -u +%Y-%m-%dT%H:%MZ)"
          git -c http.https://github.com/.extraheader="$auth" pull -q --rebase
          git -c http.https://github.com/.extraheader="$auth" push -q
      # Alarme hors de GitHub (Worker Cloudflare, alarme/worker.js) : sans signe de vie pendant 24 h, Jules est prévenu
      # sur Telegram. Ne casse jamais le réveil ; ne fait rien tant que ALARME_SECRET n'est pas posé
      - name: Signe de vie (alarme hors de GitHub)
        if: always()
        timeout-minutes: 2
        env:
          ALARME_SECRET: ${{ secrets.ALARME_SECRET }}
          PYTHONUTF8: "1"
        run: python -m agence.alarme signe
