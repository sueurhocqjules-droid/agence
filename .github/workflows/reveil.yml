# Réveil programmé de l'agence : tourne sur les machines de GitHub, PC éteint.
# L'horloge est le Worker de l'alarme (alarme/worker.js) : il lance ce workflow (programme=true) aux heures choisies par
# l'agence (organisation/rythme.toml, [reveil]). Le cron de GitHub, qui sautait environ un créneau sur deux et retardait
# les autres de 1 h 30 à 4 h 30, reste un filet : il ne fait rien si le Worker a lancé un réveil dans les 5 h.
# Tout passe par le lanceur (python -m agence.lancer <nom>) : pause, budget, journal. Une étape par agent, avec ses seuls secrets.
# Le registre modifié est commité par le robot GitHub.
name: Reveil

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # filet si le Worker se tait ; le flux ne refait rien de déjà fait
  workflow_dispatch:
    inputs:
      programme:
        description: "Réveil programmé (lancé par le Worker à son heure) : compte pour la séance du Pilote"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write      # la Sûreté compte les minutes GitHub du mois ; le réveil lance la séance du Pilote
  issues: write       # guichet et contacts : demandes écrites par l'agence, commentaire et fermeture d'un contact envoyé

concurrency:
  group: registre     # un seul écrivain du registre à la fois
  cancel-in-progress: false

jobs:
  # Filet : un réveil du cron de GitHub ne fait rien si un réveil lancé à la main ou par le Worker est parti dans les 5 h
  # (il arrive souvent avec des heures de retard). En cas de doute (API injoignable), il tourne.
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      lancer: ${{ steps.garde.outputs.lancer }}
    steps:
      - id: garde
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          lancer=true
          if [ "$EVENEMENT" = schedule ]; then
            depuis=$(date -u -d '5 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            recents=$(gh run list -w reveil.yml -e workflow_dispatch -L 20 --json createdAt,conclusion               --jq "[.[] | select(.createdAt >= \"$depuis\" and .conclusion != \"cancelled\")] | length" || echo 0)
            if [ "${recents:-0}" -gt 0 ]; then
              lancer=false
              echo "Réveil déjà lancé depuis $depuis : le cron de GitHub arrive après coup, rien à faire"
            fi
          fi
          echo "lancer=$lancer" >> "$GITHUB_OUTPUT"

  agents:
    needs: garde
    if: needs.garde.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # Cloisonnement : le jeton du dépôt n'est pas laissé dans .git/config, seule l'étape de commit le reçoit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Moteur public : sujets à lire, et file de rendu à pousser avec la clé de déploiement (écriture sur ce seul dépôt)
      - uses: actions/checkout@v7
        with:
          repository: sueurhocqjules-droid/studio-rendu
          path: rendu
          ssh-key: ${{ secrets.RENDU_DEPLOY_KEY }}
      # Coûts des séances de l'atelier (dépôt privé chaines-studio) : clé de déploiement en lecture seule,
      # un seul fichier récupéré, clé retirée du disque après le checkout
      - uses: actions/checkout@v7
        with:
          repository: sueurhocqjules-droid/chaines-studio
          path: atelier-src
          ssh-key: ${{ secrets.ATELIER_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: atelier/couts.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config --global user.name "agence-robot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # ffmpeg statique figé dans la release « outils » de studio-rendu, empreinte vérifiée : plus d'apt-get,
      # les serveurs d'Ubuntu sont tombés le 11/11/2026
      - name: ffmpeg pour le contrôle des vidéos
        timeout-minutes: 5
        env:
          OUTILS: https://github.com/sueurhocqjules-droid/studio-rendu/releases/download/outils
          FFMPEG: ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: e940c45bf07cdf0c95e279a81c5f559ff5dfe88f0f395613bfbbd68566771a45
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$FFMPEG" "$OUTILS/$FFMPEG"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/$FFMPEG" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/$FFMPEG" -C /usr/local/bin --strip-components=2 --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
          ffmpeg -version | head -1
      # Avant tout le reste : un « Oui » de Jules (reprise d'une pause) s'applique dès ce réveil
      - name: Réponses de Jules (Telegram)
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALARME_SECRET: ${{ secrets.ALARME_SECRET }} # lecture des clics gardés par le Worker de l'alarme
          FUSION_TOKEN: ${{ secrets.FUSION_TOKEN }}     # Oui de Jules : fusion d'une PR du Pilote (agence/accords.py)
          PYTHONUTF8: "1"
        run: python -m agence.lancer reponses relever
      - name: Stats des chaînes
        if: ${{ !cancelled() }}
        env:
          YT_TOKEN_EN: ${{ secrets.YT_TOKEN_EN }}
          YT_TOKEN_ES: ${{ secrets.YT_TOKEN_ES }}
          YT_TOKEN_PT: ${{ secrets.YT_TOKEN_PT }}
          YT_TOKEN_SCALE: ${{ secrets.YT_TOKEN_SCALE }}   # Scale of Everything (17/11), à brancher par le Pilote
          PYTHONUTF8: "1"
        run: python -m agence.lancer stats
      # Après les stats (une vidéo rejetée met sa chaîne en pause), avant le flux (qui respecte cette pause)
      - name: Sûreté (compteur, seuils, sanctions)
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}   # lecture des runs du dépôt, pour les minutes du mois
          ATELIER_COUTS: atelier-src/atelier/couts.csv
          PYTHONUTF8: "1"
        run: python -m agence.lancer garde_fous
      # Avant le flux : un mail de sanction met la chaîne en pause dès ce réveil. Lecture seule, ne répond jamais
      - name: Courrier (tri de boite-chaines)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          BOITE_CHAINES: ${{ secrets.BOITE_CHAINES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: python -m agence.lancer courrier
      - name: Flux (rendu, contrôle, programmation, diffusion Instagram, Facebook, TikTok et Threads)
        if: ${{ !cancelled() }}
        env:
          YT_TOKEN_EN: ${{ secrets.YT_TOKEN_EN }}
          YT_TOKEN_ES: ${{ secrets.YT_TOKEN_ES }}
          YT_TOKEN_PT: ${{ secrets.YT_TOKEN_PT }}
          YT_TOKEN_SCALE: ${{ secrets.YT_TOKEN_SCALE }}   # Scale of Everything (17/11), à brancher par le Pilote
          GH_TOKEN: ${{ github.token }}   # lecture des artefacts du dépôt public studio-rendu
          META_TOKEN: ${{ secrets.META_TOKEN }}   # utilisateur système Meta : 3 comptes Instagram, 3 Pages
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}   # Buffer (offre Free) : publication TikTok sur les 3 comptes
          THREADS_CLE: ${{ secrets.THREADS_CLE }}   # déchiffre registre/threads.enc (jetons Threads, renouvelés par le flux)
          RENDU_DIR: rendu
          PYTHONUTF8: "1"
        run: python -m agence.lancer flux
      # Après les stats (vues sur 90 jours) : seuils de monétisation et commentaires, clé publique en lecture seule
      - name: Guetteur (seuils, commentaires)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: python -m agence.lancer guetteur
      # Messages validés par Jules (issues `contact` + `valide`). Sans GMAIL_SEND_TOKEN (droit gmail.send seul), rien ne
      # part : le script le demande au guichet, une fois. Jeton d'envoi à part de celui du Courrier (lecture seule)
      - name: Contacts (messages validés)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GMAIL_SEND_TOKEN: ${{ secrets.GMAIL_SEND_TOKEN }}
          GH_TOKEN: ${{ github.token }}   # lecture et écriture des issues `contact` et `guichet`
          PYTHONUTF8: "1"
        run: python -m agence.lancer contacts envoyer
      # En dernier : les demandes écrites pendant ce réveil sont dans le récapitulatif (une fois par jour, urgent tout de suite)
      - name: Guichet (récapitulatif à Jules)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}   # lecture des issues `guichet` et `contact`
          PYTHONUTF8: "1"
        run: python -m agence.lancer guichet recap
      # Séance du Pilote au rythme qu'il choisit (organisation/rythme.toml, [pilote]). pilote.yml commence après ce
      # réveil pour la partie qui écrit le registre (même groupe de concurrence). Seulement sur un réveil programmé,
      # pour qu'une relance à la main ne déclenche pas de séance. Nuit et matin d'abord : la limite de 5 h de
      # l'abonnement est partagée avec Jules, qui s'en sert surtout le soir.
      - name: Séance du Pilote (rythme choisi)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.programme) }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          continu=$(python -c "import tomllib; print(tomllib.load(open('organisation/rythme.toml','rb')).get('pilote', {}).get('continu') is True)" || echo False)
          if [ "$continu" = True ]; then
            # Mode continu : les séances s'enchaînent d'elles-mêmes ; le réveil relance seulement si la chaîne s'est
            # arrêtée (arrêt anti-emballement, échec, séance sans demande de relance).
            actives=$(gh run list -w pilote.yml -L 20 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 1)
            if [ "${actives:-1}" -eq 0 ]; then gh workflow run pilote.yml && echo "Séance du Pilote relancée (mode continu)"
            else echo "Séance du Pilote déjà en cours (mode continu)"; fi
            exit 0
          fi
          n=$(python -c "import tomllib; print(int(tomllib.load(open('organisation/rythme.toml','rb')).get('pilote', {}).get('seances_par_jour', 1)))" || echo 1)
          h=$((10#$(date -u +%H)))
          if   [ $h -ge 5 ]  && [ $h -lt 11 ]; then creneau=matin
          elif [ $h -ge 11 ] && [ $h -lt 17 ]; then creneau=midi
          elif [ $h -ge 17 ] && [ $h -lt 23 ]; then creneau=soir
          else creneau=nuit; fi
          case "$n" in
            1) creneaux="nuit" ;;
            2) creneaux="nuit matin" ;;
            3) creneaux="nuit matin midi" ;;
            4) creneaux="nuit matin midi soir" ;;
            *) creneaux="" ;;
          esac
          # Une séance au plus par créneau : un autre réveil du même créneau l'a peut-être déjà lancée
          case "$creneau" in
            matin) debut=$(date -u +%Y-%m-%dT05:00:00Z) ;;
            midi)  debut=$(date -u +%Y-%m-%dT11:00:00Z) ;;
            soir)  debut=$(date -u +%Y-%m-%dT17:00:00Z) ;;
            *) if [ $h -ge 23 ]; then debut=$(date -u +%Y-%m-%dT23:00:00Z); else debut=$(date -u -d yesterday +%Y-%m-%dT23:00:00Z); fi ;;
          esac
          deja=$(gh run list -w pilote.yml -L 10 --json createdAt --jq "[.[] | select(.createdAt >= \"$debut\")] | length" || echo 0)
          if [ "${deja:-0}" -gt 0 ]; then
            echo "Séance déjà lancée depuis $debut ($creneau)"
            creneaux=""
          fi
          case " $creneaux " in
            *" $creneau "*) gh workflow run pilote.yml && echo "Séance du Pilote lancée ($creneau, $n par jour)" ;;
            *) echo "Pas de séance à ce créneau ($creneau, $n par jour)" ;;
          esac
      - name: Tableau de bord (registre/tableau.md, lu par le Pilote, le juge et Jules)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          PYTHONUTF8: "1"
        run: python -m agence.tableau || echo "::warning::Tableau de bord non écrit"
      - name: Commiter le registre
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git add registre
          git diff --cached --quiet || git commit -q -m "Registre : réveil du $(date -u +%Y-%m-%dT%H:%MZ)"
          git -c http.https://github.com/.extraheader="$auth" pull -q --rebase
          git -c http.https://github.com/.extraheader="$auth" push -q
      # Alarme hors de GitHub (Worker Cloudflare, alarme/worker.js) : sans signe de vie pendant 24 h, Jules est prévenu
      # sur Telegram. Ne casse jamais le réveil ; ne fait rien tant que ALARME_SECRET n'est pas posé
      # Seul un réveil programmé (Worker ou cron) vaut pour son créneau : un lancement à la main ne fait pas de séance.
      # Le signe transmet aussi les heures du réveil au Worker.
      - name: Signe de vie (alarme hors de GitHub)
        if: always()
        timeout-minutes: 2
        env:
          ALARME_SECRET: ${{ secrets.ALARME_SECRET }}
          SOURCE: ${{ (github.event_name == 'schedule' || inputs.programme) && 'réveil' || 'réveil à la main' }}
          PYTHONUTF8: "1"
        run: python -m agence.alarme signe "$SOURCE"

  # Équipe du Pilote : ses propres scripts (equipe/, organisation/equipe.toml), sans Claude. Job à part, en lecture
  # seule : aucune clé d'écriture sur la machine (ni jeton du dépôt, ni clé de studio-rendu). Seul ce qu'ils écrivent
  # dans registre/equipe/ est gardé, par le job suivant, qui n'exécute pas leur code.
  equipe:
    needs: [garde, agents]
    if: ${{ !cancelled() && needs.garde.outputs.lancer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      produit: ${{ steps.equipe.outputs.produit }}   # vide tant que l'équipe n'a rien écrit : rien à garder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main     # avec le registre que le job agents vient de pousser
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -q -r requirements.txt
      - name: Équipe du Pilote
        id: equipe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          python -m agence.equipe
          mkdir -p registre/equipe
          if [ -n "$(ls -A registre/equipe)" ]; then echo "produit=oui" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v7
        if: steps.equipe.outputs.produit == 'oui'
        with:
          name: equipe
          path: registre/equipe/
          include-hidden-files: true
          retention-days: 2

  equipe-registre:
    needs: [garde, equipe]
    if: ${{ !cancelled() && needs.equipe.result == 'success' && needs.equipe.outputs.produit == 'oui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: equipe
          path: ${{ runner.temp }}/equipe
      - name: Garder registre/equipe/ seulement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "agence-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf registre/equipe && mkdir -p registre/equipe
          cp -r "$RUNNER_TEMP/equipe/." registre/equipe/
          find registre/equipe -type l -delete
          git add registre/equipe
          git diff --cached --quiet && exit 0
          git commit -q -m "Équipe du Pilote : $(date -u +%Y-%m-%dT%H:%MZ)"
          for essai in 1 2 3; do
            git -c http.https://github.com/.extraheader="$auth" pull -q --rebase origin main &&
              git -c http.https://github.com/.extraheader="$auth" push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
