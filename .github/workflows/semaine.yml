# Boucle de la semaine, le dimanche soir : le critique juge les prédictions échues, le Programmateur règle les créneaux,
# le Chef de contenu fixe le nombre de sujets de l'atelier (lundi 1h UTC), la recherche (Chercheur d'outils, Veilleur,
# Chef de la Recherche) prépare ses propositions, le Chef des opérations son rapport, puis la Direction (Claude) fait sa séance.
# Le bilan du lundi matin reprend les sections du critique et de la Direction.
name: Semaine

on:
  schedule:
    - cron: "37 17 * * 0"   # dimanche 18h37 à Paris (19h37 en été)
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai à blanc : Direction plafonnée à 3 $ sans rien appliquer, sans réponse aux issues, sans commit (sorties en artefact)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write     # réponses du Chef de contenu et de la Direction aux demandes de Jules
  actions: read     # relevé des réveils de la semaine pour le Chef des opérations

concurrency:
  group: registre     # même groupe que le réveil et le bilan : un seul écrivain du registre à la fois
  cancel-in-progress: false

jobs:
  semaine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENCE_COMMIT: ${{ inputs.essai && '0' || '1' }}    # chaque changement de consignes ou de créneaux a son commit
      AGENCE_ESSAI: ${{ inputs.essai && '1' || '0' }}     # essai : aucune action visible hors du runner
      ATELIER_COUTS: atelier-src/atelier/couts.csv
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Sujets déjà écrits (dépôt public studio-rendu), en lecture seule
      - uses: actions/checkout@v7
        with:
          repository: sueurhocqjules-droid/studio-rendu
          path: rendu
          persist-credentials: false
          sparse-checkout: |
            src/sujets.ts
            sujets/
          sparse-checkout-cone-mode: false
      # Coûts des séances de l'atelier (dépôt privé chaines-studio) : clé de déploiement en lecture seule,
      # un seul fichier récupéré, clé retirée du disque après le checkout
      - uses: actions/checkout@v7
        with:
          repository: sueurhocqjules-droid/chaines-studio
          path: atelier-src
          ssh-key: ${{ secrets.ATELIER_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: atelier/couts.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code@2.1.321   # version figée, celle testée en local
      - run: |
          git config --global user.name "agence-robot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Chaque étape tourne même si la précédente a échoué : la Direction lit les blocages dans les journaux
      - name: Expert en modèles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m agence.lancer expert-modeles
      - name: Critique
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agence.lancer critique
      - name: Programmateur
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agence.lancer programmateur
      - name: Chef de contenu
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RENDU_DIR: rendu
        run: python -m agence.lancer chef-contenu
      - name: Chercheur d'outils
        if: ${{ !cancelled() }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m agence.lancer chercheur-outils
      # Sans modèle ni secret : simule les achats possibles (fiches du Chercheur) pour le dossier de la Direction
      - name: Analyste des investissements
        if: ${{ !cancelled() }}
        run: |
          python -m agence.lancer analyste
          python -m agence.lancer prevu_realise
      # Relevés faits ici, avec le jeton du workflow : le Veilleur et les deux chefs n'ont aucun jeton GitHub
      - name: Relevés pour la recherche et les opérations
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/issues" -f labels=equipe:recherche -f state=open \
            -f creator=sueurhocqjules-droid -f per_page=50 > "$RUNNER_TEMP/demandes-recherche.json"
          gh run list -R "$GITHUB_REPOSITORY" --limit 200 \
            --json workflowName,status,conclusion,createdAt,url,event > "$RUNNER_TEMP/reveils.json"
      - name: Veilleur
        if: ${{ !cancelled() }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEMANDES_RECHERCHE: ${{ runner.temp }}/demandes-recherche.json
        run: python -m agence.lancer veilleur
      - name: Chef de la Recherche
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEMANDES_RECHERCHE: ${{ runner.temp }}/demandes-recherche.json
        run: python -m agence.lancer chef-recherche
      - name: Chef des opérations
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVEILS_JSON: ${{ runner.temp }}/reveils.json
        run: python -m agence.lancer chef-operations
      - name: Direction
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python -m agence.lancer direction ${{ inputs.essai && '--essai' || '' }}   # essai : 3 $ au plus, rien appliqué
      - name: Sorties de l'essai
        if: ${{ always() && inputs.essai }}
        uses: actions/upload-artifact@v4
        with:
          name: essai-semaine
          path: |
            registre
            organisation
          retention-days: 7
      - name: Commiter le registre et l'organisation
        if: ${{ always() && !inputs.essai }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git add registre organisation
          git diff --cached --quiet || git commit -q -m "Registre : semaine du $(date -u +%Y-%m-%d)"
          git -c http.https://github.com/.extraheader="$auth" pull -q --rebase
          git -c http.https://github.com/.extraheader="$auth" push -q
