# Autorisations des clés : quelle clé va à quel poste ou script (nom passé à `python -m agence.lancer <nom>`).
#
# Fichier protégé (MISSION.md, règle 9 et Gouvernance) : seul Jules l'élargit, avec Claude dans Jarvis. Aucun agent,
# ni le Pilote, ne le modifie (agence/pilote.py retire tout changement de ce fichier).
#
# Le lanceur ne transmet une clé que si elle est à la fois déclarée par la fiche (champ `env`) ou le script
# (`secrets` de scripts.toml) ET accordée ici à ce nom. Une clé déclarée sans accord n'est pas transmise : elle
# apparaît dans le récapitulatif du guichet, et le poste la demande par `agence.guichet.demander`.
# - Nouvelle clé ou nouveau compte : demande au guichet, Jules et Claude créent le compte, posent le secret
#   (`gh secret set`), l'ajoutent à l'étape du workflow et ajoutent la ligne ici.
# - Clé déjà accordée, nouveau poste : un Oui de Jules (intitulé du poste et raison), puis le nom ajouté ici.
#
# État au 14/11/2026 : les clés que chaque poste utilisait déjà.

[cles]
