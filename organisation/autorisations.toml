YT_TOKEN_ES = ["stats", "flux"]
YT_TOKEN_PT = ["stats", "flux"]
YT_TOKEN_SCALE = ["stats", "flux"]   # Scale of Everything (17/11)
YOUTUBE_API_KEY = ["guetteur"]
