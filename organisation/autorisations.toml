GEMINI_API_KEY = ["courrier", "guetteur", "gabarits"]
OPENROUTER_API_KEY = ["courrier", "guetteur", "gabarits"]
ALARME_SECRET = ["reponses"]
FUSION_TOKEN = ["reponses"]          # fusion des PR du Pilote sur le Oui de Jules (agence/accords.py, 17/11)
