# Reels par jour et par compte sur les autres réseaux, à partir des vidéos déjà publiques sur YouTube (la plus ancienne d'abord).
# Propriétaire : le Programmateur, de 1 à 5, un seul changement à la fois. Limites des plateformes : Instagram 100 posts
# par 24 h et par compte, Reels des Pages Facebook 30 par 24 h (docs Meta lues le 13/11/2026). TikTok par Buffer (offre
# Free) : 25 posts TikTok par 24 h, 10 posts en file par chaîne. Threads : 250 posts par 24 h et par compte, vidéo de
# 5 min au plus (docs Meta lues le 15/11/2026).

[instagram]
par_jour = 2

[facebook]
par_jour = 2

[tiktok]
par_jour = 3

[threads]
par_jour = 2

# Ligne d'appel mise en tête des descriptions YouTube et des légendes Instagram, Facebook, TikTok, Threads
# (agents/flux.py, appel_boutique). Vide = rien n'est ajouté. lien : https seul ; un texte par langue avec {lien}, 160
# caractères au plus. Ne touche que les vidéos envoyées ou diffusées après le changement.
[boutique]
lien = ""
en = "Printable 4K science posters from this channel: {lien}"
es = "Pósteres de ciencia del canal (4K, para imprimir): {lien}"
pt = "Pôsteres de ciência do canal (4K, para imprimir): {lien}"
