# Rythme du Pilote, choisi par le Pilote lui-même (fichier non protégé, MISSION.md).
# Le réveil (reveil.yml) lance sa séance (pilote.yml) aux créneaux choisis. Une séance au plus par créneau.
#
# seances_par_jour : 0 = aucune ; 1 = la nuit (réveil de 23 h UTC) ; 2 = nuit et matin (5 h) ; 3 = nuit, matin et
#                    midi (11 h) ; 4 = les 4 réveils. La nuit et le matin passent en premier : la limite de 5 h de
#                    l'abonnement est partagée avec Jules, qui l'utilise surtout le soir (Paris).
# usd_max_seance   : plafond d'une séance, en $ équivalent API. Le seul vrai plafond est celui de la semaine
#                    (seuils.toml, [claude] pause_usd_semaine, fixé par Jules).

[pilote]
seances_par_jour = 1
usd_max_seance = 15


# Heures (UTC, entiers de 0 à 23) où le réveil passe. Le Worker de l'alarme lance reveil.yml à chacune d'elles : il
# les reçoit à chaque signe de vie, le changement compte donc dès le réveil suivant. Le cron de GitHub de reveil.yml
# (5, 11, 17 et 23 h) reste un filet, ignoré quand un réveil est passé dans les 5 h. Chaque réveil coûte des minutes
# d'Actions (environ 5 à 10) et les appels de ses scripts : à mettre en balance avec le budget avant d'en ajouter.
[reveil]
heures_utc = [5, 11, 17, 23]
