# Scripts de l'agence : rien à juger, donc pas d'agent, mais chacun a un agent propriétaire (sa fiche dans postes/).
# Le lanceur (python -m agence.lancer <nom>) ne leur transmet que les secrets listés ici.

[stats]
proprietaire = "chef-operations"
module = "agents.stats"
description = "le relevé des vues des chaînes"
secrets = ["YT_TOKEN_EN", "YT_TOKEN_ES", "YT_TOKEN_PT"]

[flux]
proprietaire = "chef-contenu"
module = "agents.flux"
description = "le rendu, le contrôle, la programmation des vidéos et leur diffusion sur Instagram, Facebook, TikTok et Threads"
secrets = ["YT_TOKEN_EN", "YT_TOKEN_ES", "YT_TOKEN_PT", "GH_TOKEN", "META_TOKEN", "BUFFER_API_KEY", "THREADS_CLE"]

# hors_pause : seule une pause à son propre nom l'arrête (ni « tout », ni ses supérieurs), pour que la Sûreté
# continue de surveiller et que Jules puisse toujours lever une pause par Telegram.

[reponses]
proprietaire = "surete"
module = "agence.questions"
description = "la lecture de tes réponses Telegram"
secrets = ["TELEGRAM_BOT_TOKEN", "FUSION_TOKEN"]
hors_pause = true

[accords]
proprietaire = "surete"
module = "agence.accords"
description = "les questions Telegram sur les PR qui touchent un fichier protégé"
secrets = ["TELEGRAM_BOT_TOKEN", "GH_TOKEN"]
hors_pause = true

[garde_fous]
proprietaire = "surete"
module = "agents.surete"
description = "la surveillance des coûts et des sanctions"
secrets = ["TELEGRAM_BOT_TOKEN", "GH_TOKEN"]
hors_pause = true

# Le guichet (agence/guichet.py) : ce que l'agence demande à Jules. Récapitulatif une fois par jour, urgent tout de suite.
[guichet]
proprietaire = "chef-operations"
module = "agence.guichet"
description = "le récapitulatif quotidien des demandes du guichet et des contacts à valider, et des équipes dont les demandes de Jules sont illisibles"
secrets = ["TELEGRAM_BOT_TOKEN", "GH_TOKEN"]

# Les contacts (agence/contacts.py) : envoie les messages validés par Jules. GMAIL_SEND_TOKEN (droit gmail.send seul)
# accordé le 15/11/2026 dans autorisations.toml (guichet #13).
[contacts]
proprietaire = "chef-operations"
module = "agence.contacts"
description = "l'envoi des messages aux personnes, une fois validés par toi"
secrets = ["GMAIL_SEND_TOKEN", "GH_TOKEN"]

# Les délais (agence/delais.py) : « Décider vite » appliqué par le code. Un besoin écrit depuis plus de 48 h fait partir
# en essai, chez l'Ingénierie, sa première option gratuite et sans compte ; le délai besoin → mise en service est mesuré.
[delais]
proprietaire = "chef-operations"
module = "agence.delais"
description = "le départ en essai des besoins au délai dépassé et la mesure des délais"
secrets = ["GH_TOKEN"]

[prevu_realise]
proprietaire = "analyste"
module = "agents.prevu_realise"
description = "l'écart prévu / réalisé des achats accordés par Jules, à 4 et 8 semaines"
secrets = []

[bilan]
proprietaire = "direction"
module = "agents.bilan"
description = "le bilan du lundi"
secrets = ["TELEGRAM_BOT_TOKEN", "GH_TOKEN"]
