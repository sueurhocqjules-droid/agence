# Seuils fixés par Jules (fichier protégé : le Pilote demande au guichet pour en changer un).
# Semaine = celle de l'abonnement Claude de Jules : depuis le vendredi 23 h UTC (agence/lancer.py, debut_semaine).

[claude]
# Étalon : dollars équivalent API pour 1 % de la limite hebdomadaire de Jules. Mesuré le 13/11/2026 (barre d'état,
# ~/.claude/limites.jsonl) : 77 % → 80 % pendant le nightwork pour 10,44 $, soit 3,48 $ par point.
dollars_par_pourcent = 3.5
# Lancement (grill du 17/11) : carte blanche jusqu'à cette date, la seule limite est de laisser la réserve à Jules.
lancement_jusqu_au = 2026-11-20T23:00:00Z
# Part de Jules, toujours gardée : la séance s'arrête quand l'utilisation réelle de la semaine (lue dans le flux de
# Claude Code) atteint 100 - reserve_pourcent %.
reserve_pourcent = 15
# Après le lancement : part de la limite hebdomadaire laissée à l'agence (30 % ≈ 105 $ par semaine avec l'étalon)
part_pourcent = 30
# Alerte à Jules quand l'agence passe ce pourcentage de sa part
alerte_part_pourcent = 85
pause_cibles = ["pilote"]

[emballement]
# Garde-fou 4 (MISSION.md) : arrêts d'une séance qui s'emballe. Chaque arrêt est dit à Jules sur Telegram, la séance
# suivante repart normalement. Aucun plafond de travail.
# Une séance seule ne dépasse pas cette part de la limite hebdomadaire (25 % ≈ 87 $)
seance_max_pourcent = 25
# La même action (même outil, même entrée) en échec tant de fois de suite
echecs_identiques_max = 10
# Minutes sans écrire un fichier (Edit, Write) : une séance qui tourne en rond
minutes_sans_ecrire_max = 120

[github]
# Offre gratuite : 2 000 minutes par mois pour les dépôts privés (illimité pour un dépôt public)
alerte_minutes_mois = 1500

[echecs]
# Passages en échec d'affilée d'un même agent ou script avant d'alerter Jules
alerte_consecutifs = 3
